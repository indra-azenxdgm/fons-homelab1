services:
  postgres:
    image: postgres:16
    container_name: fons_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fons_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - fons_fons_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fons_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: fons_gotenberg
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 256
    environment:
      CHROMIUM_AUTO_START: "false"
      LIBREOFFICE_AUTO_START: "false"
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3006}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fons_backend
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 160m
    pids_limit: 96
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    environment:
      PORT: "3001"
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/fons_dev?schema=public}
      PDF_PROVIDER: ${BACKEND_PDF_PROVIDER:-gotenberg}
      GOTENBERG_URL: ${BACKEND_GOTENBERG_URL:-http://gotenberg:3000}
      PDF_REQUEST_TIMEOUT_MS: ${BACKEND_PDF_REQUEST_TIMEOUT_MS:-45000}
      CORS_ORIGIN: ${BACKEND_CORS_ORIGIN:-https://www.fonsjogjaac.com}
      CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS:-https://www.fonsjogjaac.com}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-wdkaokr3181sa8hhsjascnam1728djsakl2ids28321409571kjsadhuwzxncak2810}
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      TRUST_PROXY: ${BACKEND_TRUST_PROXY:-0}
      REQUEST_BODY_LIMIT: ${BACKEND_REQUEST_BODY_LIMIT:-1mb}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      ALLOW_DEFAULT_DEV_ADMIN_SEED: ${ALLOW_DEFAULT_DEV_ADMIN_SEED:-false}
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-3005}:3001"
    networks:
      default:
        aliases:
          - fons_backend_api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://www.fonsjogjaac.com}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.fonsjogjaac.com}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Fon's}
        NEXT_PUBLIC_WHATSAPP_NUMBER: "${NEXT_PUBLIC_WHATSAPP_NUMBER:-087819995004}"
        NEXT_PUBLIC_SERVICE_CITY: ${NEXT_PUBLIC_SERVICE_CITY:-Yogyakarta}
        NEXT_PUBLIC_TURNSTILE_ENABLED: ${NEXT_PUBLIC_TURNSTILE_ENABLED:-false}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: fons_frontend
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 96m
    pids_limit: 64
    depends_on:
      backend:
        condition: service_healthy
    environment:
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://fons_backend_api:3001}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://www.fonsjogjaac.com}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.fonsjogjaac.com}
      NODE_ENV: ${FRONTEND_NODE_ENV:-production}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Fon's}
      NEXT_PUBLIC_WHATSAPP_NUMBER: "${NEXT_PUBLIC_WHATSAPP_NUMBER:-087819995004}"
      NEXT_PUBLIC_SERVICE_CITY: ${NEXT_PUBLIC_SERVICE_CITY:-Yogyakarta}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      NEXT_PUBLIC_TURNSTILE_ENABLED: ${NEXT_PUBLIC_TURNSTILE_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3004}:3010"
    networks:
      default: {}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
  fons_cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: fons_cloudflare
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    command: tunnel --config /etc/cloudflared/config.yml run 71328a20-c09f-4481-a4c0-9b7a6477bedd
    volumes:
      - type: bind
        source: ./cloudflared/config.yml
        target: /etc/cloudflared/config.yml
        read_only: true
      - type: bind
        source: ./cloudflared/71328a20-c09f-4481-a4c0-9b7a6477bedd.json
        target: /etc/cloudflared/71328a20-c09f-4481-a4c0-9b7a6477bedd.json
        read_only: true

volumes:
  fons_fons_postgres_data:
